version: '3.8'

x-redis-dependency: &redis-dependency
  webhook-redis:
    condition: service_healthy

x-redis-environment: &redis-environment
  REDIS_URL: "redis://:${WEBHOOK_REDIS_PASSWORD:?WEBHOOK_REDIS_PASSWORD is required}@webhook-redis:6379"

services:
  ingress:
    build: ./dispatcher
    expose:
      - "3000"
    environment:
      VERIFY_TOKEN: ${VERIFY_TOKEN}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      <<: *redis-environment
    depends_on: *redis-dependency
    restart: always
    networks:
      - webhook-backend
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.dispatcher.rule=Host(`webhook.moviatech.com.mx`)
      - traefik.http.routers.dispatcher.entrypoints=websecure
      - traefik.http.routers.dispatcher.tls.certResolver=letsencrypt
      - traefik.http.services.dispatcher.loadbalancer.server.port=3000

  worker_whatsapp:
    build: ./worker
    environment:
      <<: *redis-environment
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      CRM_WEBHOOK_TIMEOUT_MS: ${CRM_WEBHOOK_TIMEOUT_MS:-3000}
    depends_on: *redis-dependency
    restart: always
    networks:
      - webhook-backend

  worker_meta:
    build: ./meta_worker
    environment:
      <<: *redis-environment
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      CRM_WEBHOOK_TIMEOUT_MS: ${CRM_WEBHOOK_TIMEOUT_MS:-3000}
    depends_on: *redis-dependency
    restart: always
    networks:
      - webhook-backend

  worker_instagram:
    build: ./instagram_worker
    environment:
      <<: *redis-environment
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      CRM_WEBHOOK_TIMEOUT_MS: ${CRM_WEBHOOK_TIMEOUT_MS:-3000}
    depends_on: *redis-dependency
    restart: always
    networks:
      - webhook-backend

  non_message_worker:
    build: ./non_message_worker
    environment:
      <<: *redis-environment
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on: *redis-dependency
    restart: always
    networks:
      - webhook-backend

  webhook-redis:
    image: redis:alpine
    environment:
      WEBHOOK_REDIS_PASSWORD: ${WEBHOOK_REDIS_PASSWORD:?WEBHOOK_REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$WEBHOOK_REDIS_PASSWORD" --appendonly yes
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$WEBHOOK_REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - webhook-redis-data:/data
    restart: always
    networks:
      - webhook-backend

networks:
  webhook-backend:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  webhook-redis-data:
    name: webhook-redis-data
